name: yoobbel
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  material_design_icons_flutter: ^7.0.7296
  url_launcher: ^6.3.2
  change_app_package_name: ^1.5.0
  get_storage: ^2.1.1
  intl: ^0.20.2
  image_picker: ^1.2.1
  flutter_launcher_icons: ^0.14.4
  iconsax: ^0.0.8
  fl_chart: ^1.1.1
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_local_notifications: ^20.1.0
  google_nav_bar: ^5.0.7
  curved_navigation_bar: ^1.0.6
  dot_navigation_bar: ^1.0.2
  http: ^1.6.0
  cached_network_image: ^3.4.1
  gal: ^2.3.2
  path_provider: ^2.1.5
  excel: ^4.0.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Flutter configuration
flutter:
  uses-material-design: true

  assets:
    - assets/images/zobbra.jpeg
    - assets/images/
    - assets/logos/

# Launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/zobbra.jpeg"